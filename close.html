<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WebToMobile Pro Close Console</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#eaf1fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 14px 50px}.head{text-align:center;margin:6px 0 18px}.head img{height:48px}.head h1{font-size:20px;margin:6px 0 2px;color:#60a5fa}.head p{margin:0;color:#8ea0b8;font-size:13px}.card{background:#111b2b;border:1px solid #20304a;border-radius:14px;padding:15px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{border:1px solid #2b3e5c;background:#0d1726;color:#c8d6e8;border-radius:10px;padding:13px 8px;font-weight:700;font-size:13px}.action.active{border-color:#3b82f6;background:#10274a;color:white}.action.danger.active{border-color:#ef4444;background:#35151b}.field{margin-bottom:12px}label{display:block;color:#8ea0b8;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #2b3e5c;border-radius:9px;background:#08111f;color:white;padding:13px;font-size:16px}textarea{min-height:72px}.delivery{display:flex;gap:8px}.delivery button{flex:1;border:1px solid #2b3e5c;border-radius:9px;background:#0d1726;color:#9fb0c6;padding:11px;font-weight:700}.delivery button.active{border-color:#3b82f6;color:white;background:#10274a}.primary{width:100%;border:0;border-radius:10px;background:#2563eb;color:white;padding:15px;font-size:16px;font-weight:800}.primary:disabled{opacity:.5}.secondary{width:100%;border:1px solid #2b3e5c;border-radius:10px;background:#111b2b;color:#c8d6e8;padding:12px;font-weight:700}.dangerbtn{background:#b91c1c}.msg{display:none;border-radius:9px;padding:11px;font-size:13px;margin-bottom:12px}.msg.err{display:block;background:#35151b;border:1px solid #7f1d1d;color:#fecaca}.msg.ok{display:block;background:#123020;border:1px solid #166534;color:#bbf7d0}.muted{color:#8ea0b8;font-size:12px;line-height:1.5}.hidden{display:none!important}#gate{position:fixed;inset:0;z-index:20;background:#08111f;display:flex;align-items:center;justify-content:center;padding:18px}.gatebox{width:100%;max-width:390px;background:#111b2b;border:1px solid #20304a;border-radius:14px;padding:24px}.identity{font-size:12px;color:#8ea0b8;text-align:center;margin-bottom:10px}.confirm{display:flex;gap:9px;align-items:flex-start;color:#c8d6e8;font-size:13px;line-height:1.4}.confirm input{width:auto;margin-top:2px}
</style>
</head>
<body>
<div id="gate"><div class="gatebox"><h2 style="margin-top:0">Close Console Access</h2><p class="muted">Enter the individual credential issued for this console. It is exchanged for a secure session before any sales action can run.</p><div id="gateMsg" class="msg"></div><input id="credential" type="password" placeholder="Paste access credential" autocomplete="off"><button id="unlock" class="primary" style="margin-top:10px">Unlock Console</button></div></div>
<div class="wrap" id="app" style="display:none">
<div class="head"><img src="logo.png" alt="WebToMobile Pro"><h1>Close Console</h1><p>Fast field actions for live prospect conversations</p></div>
<div class="identity" id="identity"></div><div id="msg" class="msg"></div>
<div class="card"><div class="grid">
<div class="field"><label>First name</label><input id="first" autocomplete="given-name"></div>
<div class="field"><label>Business</label><input id="business" autocomplete="organization"></div>
<div class="field"><label>Phone</label><input id="phone" inputmode="tel" autocomplete="tel"></div>
<div class="field"><label>Email</label><input id="email" inputmode="email" autocomplete="email"></div>
</div></div>
<div class="card"><label>Action</label><div class="actions">
<button class="action active" data-action="send_demo">▶ Send Demo</button>
<button class="action" data-action="send_info">ⓘ Send Information</button>
<button class="action" data-action="send_checkout">$ Send Checkout</button>
<button class="action" data-action="callback">☎ Schedule Callback</button>
<button class="action" data-action="follow_up">↻ Follow Up</button>
<button class="action" data-action="book_zoom">▣ Book Founder Call</button>
<button class="action danger" data-action="not_interested">× Not Interested</button>
</div></div>
<div class="card" id="deliveryCard"><label>Delivery</label><div class="delivery"><button id="smsBtn" class="active">Text Message</button><button id="emailBtn">Email</button></div></div>
<div class="card hidden" id="callbackCard"><div class="grid"><div class="field"><label>Callback date</label><input id="cbDate" type="date"></div><div class="field"><label>Callback time CT</label><input id="cbTime" type="time"></div></div><div class="field"><label>Reason (optional)</label><input id="cbReason"></div></div>
<div class="card hidden" id="zoomCard"><div class="grid"><div class="field"><label>Meeting date</label><input id="zoomDate" type="date"></div><div class="field"><label>Meeting time CT</label><select id="zoomTime"><option value="">Select</option><option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>12:00</option></select></div></div></div>
<div class="card hidden" id="notInterestedCard"><label class="confirm"><input id="declined" type="checkbox">Prospect clearly declined or opted out. Mark them Not Interested and stop active outreach.</label></div>
<div class="card"><div class="field"><label>Notes (optional)</label><textarea id="notes" placeholder="Short field note"></textarea></div><button id="run" class="primary">Send Demo</button></div>
<button id="signout" class="secondary">Sign out of this device</button>
</div>
<script>
const BASE="https://dhriiwtpsaorqlxiuayu.supabase.co/functions/v1";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRocmlpd3Rwc2FvcnFseGl1YXl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1MDQ3MDAsImV4cCI6MjA4MzA4MDcwMH0.l_-EJXZbxua0NZxaw8FnFM_S-JDCwagObFhXNQ4GKzM";
const SESSION_KEY="wtm_cc_session";
let action="send_demo",delivery="sms",identity=null,requestId=crypto.randomUUID();
const $=id=>document.getElementById(id);
const apiHeaders=()=>({"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON});
function showMsg(text,type="err"){const m=$("msg");m.textContent=text;m.className="msg "+type}function clearMsg(){const m=$("msg");m.textContent="";m.className="msg"}function setGateMsg(text){const m=$("gateMsg");m.textContent=text;m.className="msg err"}function sessionHeaders(){return {...apiHeaders(),"X-Console-Session":localStorage.getItem(SESSION_KEY)||""}}
async function verify(){const s=localStorage.getItem(SESSION_KEY);if(!s)return false;try{const r=await fetch(BASE+"/verify-close-console-session",{method:"POST",headers:{...apiHeaders(),"X-Console-Session":s},body:"{}"});if(!r.ok){localStorage.removeItem(SESSION_KEY);return false}const d=await r.json();identity=d.closer||null;return true}catch{return false}}
async function unlock(){const credential=$("credential").value.trim();if(!credential)return setGateMsg("Enter your access credential.");$("unlock").disabled=true;try{const r=await fetch(BASE+"/create-close-console-session",{method:"POST",headers:apiHeaders(),body:JSON.stringify({credential})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Access denied");if(!d.session_token)throw new Error("This credential requires the secure individual-access flow.");localStorage.setItem(SESSION_KEY,d.session_token);identity={display_name:d.display_name,role:d.role,permissions:d.permissions};$("credential").value="";openApp()}catch(e){setGateMsg(e.message||"Unable to unlock Console")}finally{$("unlock").disabled=false}}
function openApp(){$("gate").style.display="none";$("app").style.display="block";$("identity").textContent=(identity?.display_name||"Authorized user")+" • "+(identity?.role||"closer")}
async function gateway(operation,payload){const r=await fetch(BASE+"/close-console-gateway",{method:"POST",headers:sessionHeaders(),body:JSON.stringify({operation,payload})});let d={};try{d=await r.json()}catch{}if(r.status===401){localStorage.removeItem(SESSION_KEY);$("app").style.display="none";$("gate").style.display="flex";setGateMsg("Your secure session ended. Enter your credential once to create a new session.");throw new Error("Session ended")}if(!r.ok||!d.success)throw new Error(d.error||"Action failed");return d}
function selectAction(next){action=next;document.querySelectorAll(".action").forEach(b=>b.classList.toggle("active",b.dataset.action===next));$("deliveryCard").classList.toggle("hidden",!["send_demo","send_info","send_checkout"].includes(next));$("callbackCard").classList.toggle("hidden",next!=="callback");$("zoomCard").classList.toggle("hidden",next!=="book_zoom");$("notInterestedCard").classList.toggle("hidden",next!=="not_interested");const labels={send_demo:"Send Demo",send_info:"Send Information",send_checkout:"Send Checkout",callback:"Save Callback",follow_up:"Mark Follow Up",book_zoom:"Book Founder Call",not_interested:"Mark Not Interested"};$("run").textContent=labels[next];$("run").classList.toggle("dangerbtn",next==="not_interested");clearMsg()}
function common(){return {request_id:requestId,first_name:$("first").value.trim(),business_name:$("business").value.trim(),phone:$("phone").value.trim()||undefined,email:$("email").value.trim().toLowerCase()||undefined,notes:$("notes").value.trim()||undefined}}
function validate(p){if(!p.first_name)throw new Error("Enter the prospect's first name.");if(!p.business_name)throw new Error("Enter the business name.");if(["send_demo","send_info","send_checkout"].includes(action)){if(delivery==="sms"&&!p.phone)throw new Error("Enter a phone number for text delivery.");if(delivery==="email"&&!p.email)throw new Error("Enter an email address for email delivery.")}if(["follow_up","not_interested","callback","book_zoom"].includes(action)&&!p.phone&&!p.email)throw new Error("Enter at least a phone number or email to identify the lead.")}
async function run(){clearMsg();const p=common();try{validate(p);if(["send_demo","send_info","send_checkout"].includes(action))p.delivery_method=delivery;if(action==="callback"){p.callback_date=$("cbDate").value;p.callback_time=$("cbTime").value;p.callback_reason=$("cbReason").value.trim()||undefined;if(!p.callback_date||!p.callback_time)throw new Error("Choose a callback date and time.")}if(action==="book_zoom"){p.date=$("zoomDate").value;p.time=$("zoomTime").value;p.timezone="America/Chicago";if(!p.date||!p.time)throw new Error("Choose a meeting date and time.")}if(action==="not_interested"){if(!$("declined").checked)throw new Error("Confirm that the prospect clearly declined or opted out.");Object.assign(p,{objection_firm:true,objection_exact_statement:"Prospect declined / not interested",objection_category:"firm_rejection"})}$("run").disabled=true;await gateway(action,p);const success={send_demo:"Demo sent successfully.",send_info:"Information sent successfully.",send_checkout:"Checkout link sent successfully.",callback:"Callback saved successfully.",follow_up:"Follow-up saved successfully.",book_zoom:"Founder call booked successfully.",not_interested:"Lead marked Not Interested."}[action];showMsg(success,"ok");requestId=crypto.randomUUID();if(action==="not_interested")$("declined").checked=false}catch(e){if(e.message!=="Session ended")showMsg(e.message||"Action failed")}finally{$("run").disabled=false}}
document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>selectAction(b.dataset.action)));$("smsBtn").onclick=()=>{delivery="sms";$("smsBtn").classList.add("active");$("emailBtn").classList.remove("active")};$("emailBtn").onclick=()=>{delivery="email";$("emailBtn").classList.add("active");$("smsBtn").classList.remove("active")};$("unlock").onclick=unlock;$("credential").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});$("run").onclick=run;$("signout").onclick=async()=>{const s=localStorage.getItem(SESSION_KEY);if(s){try{await fetch(BASE+"/revoke-close-console-session",{method:"POST",headers:{...apiHeaders(),"X-Console-Session":s},body:"{}"})}catch{}}localStorage.removeItem(SESSION_KEY);location.reload()};(async()=>{if(await verify())openApp();else $("gate").style.display="flex"})();
</script>
</body></html>
