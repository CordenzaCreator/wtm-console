<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WTM Secure Close Console</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,system-ui,sans-serif;background:#0a0e1a;color:#e6ecf5}#auth{position:fixed;inset:0;z-index:10;background:#0a0e1a;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:390px;background:#111827;border:1px solid #1f2a44;border-radius:14px;padding:28px 24px}.box h1{font-size:20px;margin:0 0 8px;color:#2563eb}.box p{font-size:13px;line-height:1.5;color:#94a3b8;margin:0 0 18px}.box input{width:100%;padding:14px;border-radius:8px;border:1px solid #334155;background:#0a0e1a;color:#fff;font-size:16px}.box button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:15px}.err{display:none;margin-top:10px;color:#fca5a5;font-size:13px}.identity{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#0f172a;color:#cbd5e1;font-size:12px}iframe{width:100%;height:100%;border:0;display:none}.toolbar{position:fixed;right:10px;top:10px;z-index:8;display:none}.toolbar button{border:1px solid #334155;background:#111827;color:#cbd5e1;border-radius:7px;padding:8px 10px;font-size:12px}
</style>
</head>
<body>
<div id="auth"><div class="box"><h1>Close Console Access</h1><p>Enter the individual credential issued by Jaleel. The credential is exchanged for a temporary session and is not stored on this device.</p><input id="credential" type="password" autocomplete="off" placeholder="Paste access credential"><button id="unlock">Unlock Console</button><div class="err" id="err"></div><div class="identity" id="identity"></div></div></div>
<div class="toolbar" id="toolbar"><button id="signout">Sign out</button></div>
<iframe id="console" src="close.html" title="WebToMobile Pro Close Console"></iframe>
<script>
const BASE="https://dhriiwtpsaorqlxiuayu.supabase.co/functions/v1";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRocmlpd3Rwc2FvcnFseGl1YXl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1MDQ3MDAsImV4cCI6MjA4MzA4MDcwMH0.l_-EJXZbxua0NZxaw8FnFM_S-JDCwagObFhXNQ4GKzM";
const SESSION_KEY="wtm_cc_session";
const LEGACY_KEY="wtm_cc_legacy";
const OPERATIONS={
  "/lookup-close-lead":"lookup",
  "/send-close-checkout":"send_checkout",
  "/book-close-zoom":"book_zoom",
  "/close-console-action":null
};
const actionOperation={send_info:"send_info",callback:"callback",follow_up:"follow_up",not_interested:"not_interested",record_objection:"record_objection"};
let identity=null;
const auth=document.getElementById("auth"), frame=document.getElementById("console"), err=document.getElementById("err"), toolbar=document.getElementById("toolbar");
function apiHeaders(extra={}){return {"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON,...extra};}
function showError(message){err.textContent=message;err.style.display="block";}
function clearStored(){sessionStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(LEGACY_KEY);}
async function exchangeCredential(credential){
  const res=await fetch(BASE+"/create-close-console-session",{method:"POST",headers:apiHeaders(),body:JSON.stringify({credential})});
  const data=await res.json();
  if(!res.ok||!data.success)throw new Error(data.error||"Access denied");
  if(data.legacy){sessionStorage.setItem(LEGACY_KEY,credential);return {legacy:true,display_name:data.display_name||"Authorized Console User",role:data.role||"manager",permissions:{}};}
  sessionStorage.setItem(SESSION_KEY,data.session_token);
  return {legacy:false,display_name:data.display_name,role:data.role,permissions:data.permissions||{},expires_at:data.expires_at};
}
async function verifyStored(){
  const session=sessionStorage.getItem(SESSION_KEY), legacy=sessionStorage.getItem(LEGACY_KEY);
  if(!session&&!legacy)return false;
  const headers=apiHeaders(session?{"X-Console-Session":session}:{"X-Console-Token":legacy});
  const res=await fetch(BASE+"/verify-close-console-session",{method:"POST",headers,body:"{}"});
  if(!res.ok){clearStored();return false;}
  const data=await res.json();identity=data.closer;return true;
}
function gatewayOperation(url,body){
  const path=new URL(url).pathname.replace("/functions/v1","");
  if(path==="/close-console-action")return actionOperation[body.action]||null;
  return OPERATIONS[path]||null;
}
function installBridge(win){
  const nativeFetch=win.fetch.bind(win);
  win.fetch=async function(input,init={}){
    const url=typeof input==="string"?input:input.url;
    if(!url.startsWith(BASE))return nativeFetch(input,init);
    let body={};try{body=init.body?JSON.parse(init.body):{};}catch{}
    const operation=gatewayOperation(url,body);
    if(!operation){
      if(url.endsWith("/capture-inperson-lead"))return new Response(JSON.stringify({success:false,error:"Mobile app checkout is temporarily available through the legacy Console only during secure migration."}),{status:403,headers:{"Content-Type":"application/json"}});
      return nativeFetch(input,init);
    }
    const session=sessionStorage.getItem(SESSION_KEY),legacy=sessionStorage.getItem(LEGACY_KEY);
    const headers=apiHeaders(session?{"X-Console-Session":session}:{"X-Console-Token":legacy});
    const res=await nativeFetch(BASE+"/close-console-gateway",{method:"POST",headers,body:JSON.stringify({operation,payload:body})});
    if(res.status===401){clearStored();location.reload();}
    return res;
  };
  win.localStorage.removeItem("wtm_cc_token");
  win.document.getElementById("token-gate").style.display="none";
  win.document.getElementById("app-view").style.display="block";
  const sdr=win.document.getElementById("sdr");if(sdr){sdr.value=identity?.display_name||"";sdr.readOnly=true;}
  if(typeof win.showApp==="function")win.showApp();
}
async function unlock(){
  err.style.display="none";const credential=document.getElementById("credential").value.trim();if(!credential)return showError("Enter your access credential.");
  document.getElementById("unlock").disabled=true;
  try{identity=await exchangeCredential(credential);document.getElementById("credential").value="";startConsole();}
  catch(e){showError(e.message||"Unable to unlock Console");document.getElementById("unlock").disabled=false;}
}
function startConsole(){
  document.getElementById("identity").textContent=(identity?.display_name||"Authorized user")+" • "+(identity?.role||"closer");
  auth.style.display="none";frame.style.display="block";toolbar.style.display="block";
}
frame.addEventListener("load",()=>{if(identity)installBridge(frame.contentWindow);});
document.getElementById("unlock").addEventListener("click",unlock);
document.getElementById("credential").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
document.getElementById("signout").addEventListener("click",async()=>{
  const session=sessionStorage.getItem(SESSION_KEY);
  if(session){try{await fetch(BASE+"/revoke-close-console-session",{method:"POST",headers:apiHeaders({"X-Console-Session":session}),body:"{}"});}catch{}}
  clearStored();location.reload();
});
(async()=>{if(await verifyStored()){startConsole();}else{auth.style.display="flex";}})();
</script>
</body>
</html>
